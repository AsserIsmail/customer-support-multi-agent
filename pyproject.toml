[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-multi-agent"
version = "0.1.0"
description = "Customer support assistant backed by customer records and policy documents"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0,<2",
    "openai>=2,<3",
    "PyMuPDF>=1.26,<2",
    "python-dotenv>=1,<2",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
support-seed = "support_ai.seed:main"
support-policies = "support_ai.policies:main"
support-demo-pdfs = "support_ai.demo_pdfs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
